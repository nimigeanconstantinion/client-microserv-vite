name: CI/CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  IMAGE: ion21/client-vite

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run build          # fails the pipeline on a broken build

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha7 }}
            ${{ env.IMAGE }}:latest

  cd-bump:                            # închide bucla CI -> CD
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nimigeanconstantinion/argo-ms-gitops
          ref: master
          token: ${{ secrets.GITOPS_PAT }}
      - name: Bump image tag în gitops
        env:
          VALUES: business/app-microservices/client-vite/values.yaml
        run: |
          test -f "$VALUES" || { echo "::error::$VALUES nu există în argo-ms-gitops — refactor nepushuit?"; exit 1; }
          sed -i -E "s|^(  tag: ).*|\1${{ needs.publish.outputs.tag }}|" "$VALUES"
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Tag deja ${{ needs.publish.outputs.tag }} — nimic de comis."
            exit 0
          fi
          git commit -am "ci: client-vite -> ${{ needs.publish.outputs.tag }}"
          git push
